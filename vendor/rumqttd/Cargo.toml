[package]
edition = "2021"
rust-version = "1.70.0"
name = "rumqttd"
version = "0.20.0"
authors = ["tekjar <raviteja@bytebeam.io>"]
build = false
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "rumqttd is a high performance MQTT broker written in Rust which is light weight and embeddable"
readme = "README.md"
keywords = [
    "mqtt",
    "broker",
    "iot",
    "kafka",
    "nats",
]
categories = ["network-programming"]
license = "Apache-2.0"
repository = "https://github.com/bytebeamio/rumqtt"

[features]
allow-duplicate-clientid = []
default = [
    "use-rustls",
    "websocket",
]
use-native-tls = [
    "dep:tokio-native-tls",
    "dep:x509-parser",
]
use-rustls = [
    "dep:tokio-rustls",
    "dep:rustls-webpki",
    "dep:rustls-pemfile",
    "dep:x509-parser",
]
validate-tenant-prefix = ["verify-client-cert"]
verify-client-cert = []
websocket = [
    "dep:async-tungstenite",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:ws_stream_tungstenite",
]

[lib]
name = "rumqttd"
path = "src/lib.rs"

[[bin]]
name = "rumqttd"
path = "src/main.rs"

[[example]]
name = "alerts"
path = "examples/alerts.rs"

[[example]]
name = "external_auth"
path = "examples/external_auth.rs"

[[example]]
name = "meters"
