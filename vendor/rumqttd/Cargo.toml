[[example]]
name = "node1"
path = "examples/node1.rs"

[[example]]
name = "node2"
path = "examples/node2.rs"

[[example]]
name = "singlenode"
path = "examples/singlenode.rs"

[[example]]
name = "stress"
path = "examples/stress.rs"

