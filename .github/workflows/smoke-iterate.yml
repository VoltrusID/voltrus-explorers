name: Smoke iterate (temporary)
on:
  push:
    branches: [windows-modbus]
env:
  RUN_ID: '40074437186'
  RUN_NUMBER: '139'
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-${{ env.RUN_NUMBER }}
          path: build/modbus-poll-windows/${{ matrix.arch }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - run: pwsh scripts/smoke-windows.ps1 -Dir build/modbus-poll-windows/${{ matrix.arch }} -Arch ${{ matrix.arch }} -LicenseServer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-${{ matrix.arch }}
          path: build/modbus-poll-windows/${{ matrix.arch }}/smoke/
          if-no-files-found: ignore
