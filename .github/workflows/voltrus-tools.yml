# Voltrus Tools (the native GPUI suite in apps/voltrus-tools): formatting, lints,
# tests, an unsigned macOS app bundle and screenshots of every demo scenario
# and licence sheet; and the Mac App Store variant (`store`) linted, tested and
# bundled universal, unsigned. No secrets: safe for forks.
name: Voltrus Tools

on:
  push:
    branches: [main, "tools-*"]
    paths:
      - apps/voltrus-tools/**
      - crates/mt-modbus/**
      - crates/mt-protocol/**
      - crates/mt-bacnet/**
      - crates/mt-mqtt/**
      - crates/mt-dnp3/**
      - .github/workflows/voltrus-tools.yml
  pull_request:
    paths:
      - apps/voltrus-tools/**
      - crates/mt-modbus/**
      - crates/mt-protocol/**
      - crates/mt-bacnet/**
      - crates/mt-mqtt/**
      - crates/mt-dnp3/**
      - .github/workflows/voltrus-tools.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voltrus-tools-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/voltrus-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One cache per lockfile, saved after the build steps succeed and only
      # when there was no exact hit, so runs don't pile up copies and a broken
      # build never replaces a good cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/voltrus-tools/target
          key: voltrus-tools-macos-${{ hashFiles('apps/voltrus-tools/Cargo.lock') }}
          restore-keys: |
            voltrus-tools-macos-

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Only this workspace's packages: `--all` would also reformat the shared
      # protocol crates, which follow the repository's own style.
      - name: Format
        run: cargo fmt -p vt-protocol -p vt-engine -p vt-app-core -p vt-ui -p vt-app -- --check

      - name: Lint
        run: cargo clippy --locked --keep-going --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --no-fail-fast --workspace

      # The shared protocol crates this app extends keep their own tests, run
      # in the repository's workspace (the root CI runs them only on main).
      - name: Test shared protocol crates
        working-directory: .
        run: cargo test --locked -p mt-dnp3

      - name: Build release
        run: cargo build --locked --release -p vt-app

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/voltrus-tools/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Bundle
        run: scripts/bundle-macos.sh target/release/voltrus-tools dist

      - name: Screenshots
        run: scripts/screenshots-macos.sh "dist/Voltrus Tools.app" dist/screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: voltrus-tools-screenshots
          path: apps/voltrus-tools/dist/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-tools-macos-arm64
          path: apps/voltrus-tools/dist/Voltrus-Tools-macos-arm64.zip

  # The Mac App Store variant: `--features store` (StoreKit 2 trial and unlock
  # through the Swift bridge in vt-store), universal like the release, so it
  # can't rot. Unsigned: release.yml (app voltrus-tools) signs and uploads.
  store:
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/voltrus-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/voltrus-tools/target
          key: voltrus-tools-store-${{ hashFiles('apps/voltrus-tools/Cargo.lock') }}
          restore-keys: |
            voltrus-tools-store-

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Lint
        run: cargo clippy --locked --keep-going --workspace --all-targets --features vt-app/store -- -D warnings

      # Includes the gate: an expired trial refuses connecting and asks to
      # unlock (vt-app model::licence), and the licence state machine (vt-store).
      - name: Test
        run: cargo test --locked --no-fail-fast --workspace --features vt-app/store

      - name: Bundle (universal, unsigned)
        run: scripts/build-mas.sh bundle dist-store

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/voltrus-tools/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-tools-mas-unsigned
          path: apps/voltrus-tools/dist-store/*-mas-unsigned.zip
          if-no-files-found: error
