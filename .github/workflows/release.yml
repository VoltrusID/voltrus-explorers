# Signed release builds. Manual only: Actions -> Release -> Run workflow, or
#   gh workflow run release.yml -R VoltrusID/voltrus-explorers -f app=bacnet-explorer -f appstore=true -f dmg=true
#
# Jobs run in the `release` environment (deployments from main only), which holds the signing secrets;
# pull requests and forks never see them. Setup and secrets: docs/release.md.
#
#   appstore  universal .pkg signed for the Mac App Store; uploaded to App Store Connect when `upload` is ticked
#   dmg       universal Developer ID .dmg, notarized and stapled; attached to a GitHub Release when `github_release`
#   ios       Modbus Poll only: App Store IPA; uploaded when `upload` is ticked
name: Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App
        type: choice
        options: [bacnet-explorer, modbus-poll, dnp3-explorer, serial-monitor]
      appstore:
        description: Mac App Store .pkg
        type: boolean
        default: true
      dmg:
        description: Notarized Developer ID .dmg
        type: boolean
        default: true
      ios:
        description: iOS IPA (modbus-poll only)
        type: boolean
        default: false
      upload:
        description: Upload .pkg / IPA to App Store Connect
        type: boolean
        default: false
      github_release:
        description: Publish the .dmg as GitHub Release <app>-v<version>
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

env:
  APP: ${{ inputs.app }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

jobs:
  macos:
    if: inputs.appstore || inputs.dmg
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ inputs.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ inputs.app }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Signing identities and App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci-keychain.sh setup APPLE_DIST MAC_INSTALLER DEVELOPER_ID

      - name: Mac App Store build
        if: inputs.appstore
        run: |
          bundle_id="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['identifier'])")"
          serial="$(security find-certificate -a -c 'Apple Distribution' -p "$RUNNER_TEMP/release.keychain-db" | openssl x509 -noout -serial | cut -d= -f2)"
          python3 scripts/asc-profile.py MAC_APP_STORE "$bundle_id" "$serial" "$RUNNER_TEMP/mas.provisionprofile"
          MAS_PROFILE="$RUNNER_TEMP/mas.provisionprofile" scripts/build-macos.sh "$APP" appstore ${{ inputs.upload && '--upload' || '' }}

      - name: Developer ID build (notarized)
        if: inputs.dmg
        run: scripts/build-macos.sh "$APP" dmg --notarize

      - name: Checksums
        run: find build -name '*.pkg' -o -name '*.dmg' | xargs shasum -a 256 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app }}-macos-${{ github.run_number }}
          path: |
            build/${{ inputs.app }}/*/*.pkg
            build/${{ inputs.app }}/*/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release
        if: inputs.dmg && inputs.github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['productName'])")"
          version="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['version'])")"
          gh release create "$APP-v$version" build/$APP/dmg/*.dmg -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$product $version" --generate-notes

      - name: Remove signing material
        if: always()
        run: scripts/ci-keychain.sh cleanup

  ios:
    if: inputs.ios && inputs.app == 'modbus-poll'
    # App Store Connect requires the iOS 26 SDK (Xcode 26), which macos-15 images do not select by default.
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rust target and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ios-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: scripts/ci-keychain.sh setup

      # Tauri signs manually from IOS_CERTIFICATE (.p12, base64), IOS_CERTIFICATE_PASSWORD and
      # IOS_MOBILE_PROVISION (profile, base64); it imports them into its own keychain.
      - name: App Store profile
        env:
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          printf '%s' "$APPLE_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # macOS ships LibreSSL (reads legacy .p12 as is); OpenSSL 3 needs -legacy.
          serial="$( { openssl pkcs12 -legacy -nokeys -clcerts -in "$RUNNER_TEMP/dist.p12" -passin env:APPLE_DIST_P12_PASSWORD 2>/dev/null \
            || openssl pkcs12 -nokeys -clcerts -in "$RUNNER_TEMP/dist.p12" -passin env:APPLE_DIST_P12_PASSWORD; } \
            | openssl x509 -noout -serial | cut -d= -f2)"
          rm -f "$RUNNER_TEMP/dist.p12"
          python3 scripts/asc-profile.py IOS_APP_STORE com.joyodigitama.modbus-poll "$serial" "$RUNNER_TEMP/ios.mobileprovision"
          echo "IOS_MOBILE_PROVISION=$(base64 < "$RUNNER_TEMP/ios.mobileprovision" | tr -d '\n')" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/ios.mobileprovision"

      - name: Build IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: apps/modbus-poll/scripts/build-ios.sh --build-number "$(date +%s)"

      - name: Upload to App Store Connect
        if: inputs.upload
        run: |
          ipa="$(find apps/modbus-poll/src-tauri/gen/apple/build -name '*.ipa' | head -1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modbus-poll-ios-${{ github.run_number }}
          path: apps/modbus-poll/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: scripts/ci-keychain.sh cleanup
