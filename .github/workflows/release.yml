# Signed release builds. Manual only: Actions -> Release -> Run workflow, or
#   gh workflow run release.yml -R VoltrusID/voltrus-explorers -f app=bacnet-explorer -f appstore=true -f dmg=true
#
# Jobs run in the `release` environment (deployments from main only), which holds the signing secrets;
# pull requests and forks never see them. Setup and secrets: docs/release.md.
#
#   appstore  universal .pkg signed for the Mac App Store; uploaded to App Store Connect when `upload` is ticked
#   dmg       universal Developer ID .dmg, notarized and stapled; attached to a GitHub Release when `github_release`
#   ios       iPhone/iPad App Store IPA of the selected app (apps/<app>/scripts/build-ios.sh); uploaded when `upload` is ticked
#   windows   Modbus Poll only: unsigned NSIS installer and portable zip for x64 and ARM64 (scripts/build-windows.ps1), smoke-tested
#             on Windows runners, published with SHA256SUMS.txt as GitHub Release modbus-poll-windows-v<version> when `github_release`.
#             Needs no secrets, so these jobs do not use the `release` environment.
name: Release

on:
  workflow_dispatch:
    inputs:
      app:
        description: App
        type: choice
        options: [bacnet-explorer, modbus-poll, dnp3-explorer, s7-explorer, ble-inspector, enip-explorer, serial-monitor, nats-explorer, mqtt-explorer, opcua-explorer]
      appstore:
        description: Mac App Store .pkg
        type: boolean
        default: true
      dmg:
        description: Notarized Developer ID .dmg
        type: boolean
        default: true
      ios:
        description: iOS IPA (iPhone and iPad)
        type: boolean
        default: false
      upload:
        description: Upload .pkg / IPA to App Store Connect
        type: boolean
        default: false
      github_release:
        description: Publish the .dmg (or, with `windows`, the Windows files) as a GitHub Release (<app>-v<version>, modbus-poll-windows-v<version>)
        type: boolean
        default: false
      windows:
        description: Windows installer and portable zip, x64 and ARM64 (Modbus Poll only; unsigned, Pro by licence key)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.app }}
  cancel-in-progress: false

env:
  APP: ${{ inputs.app }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

jobs:
  macos:
    if: inputs.appstore || inputs.dmg
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ inputs.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ inputs.app }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Signing identities and App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci-keychain.sh setup APPLE_DIST MAC_INSTALLER DEVELOPER_ID

      - name: Mac App Store build
        if: inputs.appstore
        run: |
          bundle_id="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['identifier'])")"
          serial="$(security find-certificate -a -c 'Apple Distribution' -p "$RUNNER_TEMP/release.keychain-db" | openssl x509 -noout -serial | cut -d= -f2)"
          python3 scripts/asc-profile.py MAC_APP_STORE "$bundle_id" "$serial" "$RUNNER_TEMP/mas.provisionprofile"
          MAS_PROFILE="$RUNNER_TEMP/mas.provisionprofile" scripts/build-macos.sh "$APP" appstore ${{ inputs.upload && '--upload' || '' }}

      - name: Developer ID build (notarized)
        if: inputs.dmg
        run: scripts/build-macos.sh "$APP" dmg --notarize

      - name: Checksums
        run: find build -name '*.pkg' -o -name '*.dmg' | xargs shasum -a 256 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app }}-macos-${{ github.run_number }}
          path: |
            build/${{ inputs.app }}/*/*.pkg
            build/${{ inputs.app }}/*/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Release
        if: inputs.dmg && inputs.github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['productName'])")"
          version="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['version'])")"
          gh release create "$APP-v$version" build/$APP/dmg/*.dmg -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$product $version" --generate-notes

      - name: Remove signing material
        if: always()
        run: scripts/ci-keychain.sh cleanup

  ios:
    if: inputs.ios
    # App Store Connect requires the iOS 26 SDK (Xcode 26), which macos-15 images do not select by default.
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rust target and XcodeGen
        run: |
          rustup target add aarch64-apple-ios
          brew install xcodegen

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ios-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ios-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: scripts/ci-keychain.sh setup

      # Tauri signs manually from IOS_CERTIFICATE (.p12, base64), IOS_CERTIFICATE_PASSWORD and
      # IOS_MOBILE_PROVISION (profile, base64); it imports them into its own keychain.
      - name: App Store profile
        env:
          APPLE_DIST_P12_BASE64: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          APPLE_DIST_P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          printf '%s' "$APPLE_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # macOS ships LibreSSL (reads legacy .p12 as is); OpenSSL 3 needs -legacy.
          serial="$( { openssl pkcs12 -legacy -nokeys -clcerts -in "$RUNNER_TEMP/dist.p12" -passin env:APPLE_DIST_P12_PASSWORD 2>/dev/null \
            || openssl pkcs12 -nokeys -clcerts -in "$RUNNER_TEMP/dist.p12" -passin env:APPLE_DIST_P12_PASSWORD; } \
            | openssl x509 -noout -serial | cut -d= -f2)"
          rm -f "$RUNNER_TEMP/dist.p12"
          bundle_id="$(python3 -c "import json; print(json.load(open('apps/$APP/src-tauri/tauri.conf.json'))['identifier'])")"
          python3 scripts/asc-profile.py IOS_APP_STORE "$bundle_id" "$serial" "$RUNNER_TEMP/ios.mobileprovision"
          echo "IOS_MOBILE_PROVISION=$(base64 < "$RUNNER_TEMP/ios.mobileprovision" | tr -d '\n')" >> "$GITHUB_ENV"
          # Apps with an iOS entitlements file (BACnet Explorer: Who-Is scanning needs the multicast entitlement) only
          # get it when the profile carries it; otherwise signing the archive would fail.
          if [[ -f "apps/$APP/src-tauri/entitlements.ios.plist" ]]; then
            if security cms -D -i "$RUNNER_TEMP/ios.mobileprovision" | grep -q 'com.apple.developer.networking.multicast'; then
              echo "IOS_MULTICAST=1" >> "$GITHUB_ENV"
            else
              echo "::notice::The provisioning profile has no multicast networking entitlement: building without it (Who-Is scanning finds nothing on iOS). See docs/ios-multicast.md."
            fi
          fi
          rm -f "$RUNNER_TEMP/ios.mobileprovision"

      - name: Build IPA
        env:
          IOS_CERTIFICATE: ${{ secrets.APPLE_DIST_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: apps/$APP/scripts/build-ios.sh --build-number "$(date +%s)"

      - name: Upload to App Store Connect
        if: inputs.upload
        run: |
          ipa="$(find apps/$APP/src-tauri/gen/apple/build -name '*.ipa' | head -1)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.app }}-ios-${{ github.run_number }}
          path: apps/${{ inputs.app }}/src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: scripts/ci-keychain.sh cleanup

  windows-build:
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Only Modbus Poll has a Windows build
        if: inputs.app != 'modbus-poll'
        shell: bash
        run: echo "::error::The Windows build is Modbus Poll only (app=$APP)"; exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-${{ matrix.arch }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build installer and portable zip
        run: pwsh scripts/build-windows.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/modbus-poll-windows/${{ matrix.arch }}/*.exe
            build/modbus-poll-windows/${{ matrix.arch }}/*.zip
          if-no-files-found: error
          retention-days: 30

  # Installs, starts and uninstalls the files on a Windows machine of the same architecture before anything is published.
  windows-smoke:
    needs: windows-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-${{ github.run_number }}
          path: build/modbus-poll-windows/${{ matrix.arch }}

      - name: Install, start and uninstall
        run: pwsh scripts/smoke-windows.ps1 -Dir build/modbus-poll-windows/${{ matrix.arch }} -Arch ${{ matrix.arch }} -LicenseServer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-smoke-${{ github.run_number }}
          path: build/modbus-poll-windows/${{ matrix.arch }}/smoke/
          if-no-files-found: ignore
          retention-days: 30

  windows-release:
    needs: windows-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: modbus-poll-windows-*-${{ github.run_number }}
          path: files
          merge-multiple: true

      - name: Checksums
        working-directory: files
        run: |
          ls -l
          sha256sum *.exe *.zip | tee SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Release
        if: inputs.github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c "import json; print(json.load(open('apps/modbus-poll/src-tauri/tauri.conf.json'))['version'])")"
          cat > notes.md <<NOTES
          Modbus Poll $version for Windows 10 and 11, 64-bit (x64) and ARM64. Direct download; there is no Microsoft Store build.

          - \`Modbus-Poll-$version-windows-x64-setup.exe\` and \`...-arm64-setup.exe\`: installer, per user, no administrator rights needed.
          - \`Modbus-Poll-$version-windows-x64-portable.zip\` and \`...-arm64-portable.zip\`: unzip and run, nothing is installed.
          - \`SHA256SUMS.txt\`: check a download with \`certutil -hashfile <file> SHA256\`.

          **These files are not code-signed.** Windows SmartScreen shows "Windows protected your PC" the first time:
          choose "More info", then "Run anyway". The app needs the Microsoft Edge WebView2 runtime (preinstalled on Windows 11 and
          current Windows 10; the installer fetches it when it is missing).

          Free with limits (20 polled values, one connection, one saved profile). Pro unlocks with a licence key
          (\$14.99 once, https://voltrus.id/modbus-poll/windows/): Info, then Enter key. The key is checked online once;
          after that the app works offline. Source: GPL-3.0-or-later, this repository.
          NOTES
          gh release create "modbus-poll-windows-v$version" files/*.exe files/*.zip files/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Modbus Poll $version for Windows" --notes-file notes.md
