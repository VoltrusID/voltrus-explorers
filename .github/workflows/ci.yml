# Checks for every push and pull request. No secrets: safe for forks.
# Linux: crate tests, frontend typecheck/build/tests. macOS: crate tests, and an unsigned universal build of each app.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # serialport (mt-modbus "serial" feature) links libudev; mt-store depends on tauri, which links GTK/WebKitGTK.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Crate tests
        run: cargo test -p mt-protocol -p mt-modbus -p mt-bacnet -p mt-dnp3 -p mt-s7 -p mt-ble -p mt-enip -p mt-serial -p mt-nats -p mt-mqtt -p mt-opcua -p mt-store -p mt-connect

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontends
        run: |
          for app in bacnet-explorer modbus-poll dnp3-explorer s7-explorer ble-inspector enip-explorer serial-monitor nats-explorer mqtt-explorer opcua-explorer; do
            (cd "apps/$app" && bunx tsc --noEmit -p . && bun run build)
          done

      - name: Frontend tests
        run: |
          bun run --cwd apps/modbus-poll test
          bun run --cwd apps/bacnet-explorer test
          bun run --cwd apps/serial-monitor test
          bun run --cwd apps/s7-explorer test
          bun run --cwd apps/opcua-explorer test
          bun run --cwd apps/ble-inspector test
          bun run --cwd apps/mqtt-explorer test

  # The same crate tests on a real Mac: the protocol simulators and clients talk over loopback sockets there too.
  test-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Crate tests
        run: cargo test -p mt-protocol -p mt-modbus -p mt-bacnet -p mt-dnp3 -p mt-s7 -p mt-enip -p mt-serial -p mt-nats -p mt-mqtt -p mt-opcua -p mt-store -p mt-connect

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [bacnet-explorer, modbus-poll, dnp3-explorer, s7-explorer, ble-inspector, enip-explorer, serial-monitor, nats-explorer, mqtt-explorer, opcua-explorer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.app }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build universal app (unsigned)
        run: scripts/build-macos.sh ${{ matrix.app }} unsigned

      # The App Store variant links StoreKit through Swift (tauri-plugin-iap); compile it for both slices
      # so a break shows up here instead of in the release job.
      - name: Check App Store variant (store feature)
        run: |
          crate="$(echo '${{ matrix.app }}' | tr '-' '_')"
          cargo check -p "$crate" --features store --target aarch64-apple-darwin --target x86_64-apple-darwin

      # These apps ship for iPhone/iPad too (the release job builds the IPA). Compile the device target here so a
      # break in the mobile entry point or an iOS-only dependency shows up in the pull request.
      - name: Check iOS target
        if: contains(fromJSON('["bacnet-explorer", "modbus-poll", "s7-explorer", "opcua-explorer"]'), matrix.app)
        run: |
          rustup target add aarch64-apple-ios
          crate="$(echo '${{ matrix.app }}' | tr '-' '_')"
          cargo check -p "$crate" --features store --target aarch64-apple-ios
