# Checks for every push and pull request. No secrets: safe for forks.
# Linux: crate tests, frontend typecheck/build/tests. macOS: crate tests, and an unsigned universal build of each app.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # serialport (mt-modbus "serial" feature) links libudev; mt-store depends on tauri, which links GTK/WebKitGTK.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Crate tests
        run: cargo test -p mt-protocol -p mt-modbus -p mt-bacnet -p mt-dnp3 -p mt-s7 -p mt-ble -p mt-enip -p mt-serial -p mt-nats -p mt-mqtt -p mt-opcua -p mt-mtconnect -p focas-proto -p mt-secsgem -p mt-store -p mt-connect

      # Licence-key activation of the Windows build (the logic is portable; the machine id falls back to /etc/machine-id).
      - name: Licence key tests
        run: cargo test -p mt-store --features keys

      # Pro by licence key in the macOS DMGs of Serial Monitor and BLE Inspector; a feature the default run does not build.
      - name: Licence-key tests (direct download)
        run: cargo test -p mt-store --features license

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Typecheck and build frontends
        run: |
          for app in bacnet-explorer modbus-poll dnp3-explorer s7-explorer ble-inspector enip-explorer serial-monitor nats-explorer mqtt-explorer opcua-explorer cnc-explorer secsgem-explorer; do
            (cd "apps/$app" && bunx tsc --noEmit -p . && bun run build)
          done

      - name: Frontend tests
        run: |
          bun run --cwd packages/mt-export test
          bun run --cwd apps/modbus-poll test
          bun run --cwd apps/bacnet-explorer test
          bun run --cwd apps/serial-monitor test
          bun run --cwd apps/s7-explorer test
          bun run --cwd apps/opcua-explorer test
          bun run --cwd apps/ble-inspector test
          bun run --cwd apps/mqtt-explorer test
          bun run --cwd apps/nats-explorer test
          bun run --cwd apps/cnc-explorer test
          bun run --cwd apps/secsgem-explorer test

  # The same crate tests on a real Mac: the protocol simulators and clients talk over loopback sockets there too.
  test-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Crate tests
        timeout-minutes: 20
        run: cargo test -p mt-protocol -p mt-modbus -p mt-bacnet -p mt-dnp3 -p mt-s7 -p mt-enip -p mt-serial -p mt-nats -p mt-mqtt -p mt-opcua -p mt-mtconnect -p focas-proto -p mt-secsgem -p mt-store -p mt-connect

      - name: Licence-key tests and direct-download builds
        run: |
          cargo test -p mt-store --features license
          cargo check -p serial_monitor -p ble_inspector -p cnc_explorer -p secsgem_explorer --features license

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [bacnet-explorer, modbus-poll, dnp3-explorer, s7-explorer, ble-inspector, enip-explorer, serial-monitor, nats-explorer, mqtt-explorer, opcua-explorer, cnc-explorer, secsgem-explorer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-${{ matrix.app }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.app }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build universal app (unsigned)
        run: scripts/build-macos.sh ${{ matrix.app }} unsigned

      # The App Store variant links StoreKit through Swift (tauri-plugin-iap); compile it for both slices
      # so a break shows up here instead of in the release job.
      - name: Check App Store variant (store feature)
        run: |
          crate="$(echo '${{ matrix.app }}' | tr '-' '_')"
          cargo check -p "$crate" --features store --target aarch64-apple-darwin --target x86_64-apple-darwin

      # These apps ship for iPhone/iPad too (the release job builds the IPA). Compile the device target here so a
      # break in the mobile entry point or an iOS-only dependency shows up in the pull request.
      - name: Check iOS target
        if: contains(fromJSON('["bacnet-explorer", "modbus-poll", "s7-explorer", "opcua-explorer"]'), matrix.app)
        run: |
          rustup target add aarch64-apple-ios
          crate="$(echo '${{ matrix.app }}' | tr '-' '_')"
          cargo check -p "$crate" --features store --target aarch64-apple-ios

  # Modbus Poll is the only app that ships for Windows. The crates it links must build and pass on Windows too,
  # and the frontend tests run there as well.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # The app's lib tests embed the frontend (tauri::generate_context!), so build it first.
      - name: Build the Modbus Poll frontend
        run: bun run build
        working-directory: apps/modbus-poll

      - name: Crate tests
        timeout-minutes: 30
        run: cargo test -p mt-protocol -p mt-modbus -p mt-store -p mt-connect

      # Licence-key activation (Windows build) and the app's own tests, with the `keys` feature the installer uses.
      - name: Licence key and app tests
        timeout-minutes: 30
        run: cargo test -p mt-store -p modbus_poll --features modbus_poll/keys

      - name: Frontend tests
        run: |
          bun run --cwd packages/mt-export test
          bun run --cwd apps/modbus-poll test

  # Unsigned Windows installer and portable zip of Modbus Poll (scripts/build-windows.ps1), x64 and ARM64.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-${{ matrix.arch }}-

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build installer and portable zip
        run: pwsh scripts/build-windows.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/modbus-poll-windows/${{ matrix.arch }}/*.exe
            build/modbus-poll-windows/${{ matrix.arch }}/*.zip
          if-no-files-found: error
          retention-days: 14

  # Installs and starts what the previous job built, on a real Windows machine of the same architecture.
  windows-smoke:
    needs: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-${{ github.run_number }}
          path: build/modbus-poll-windows/${{ matrix.arch }}

      - name: Install, start and uninstall
        run: pwsh scripts/smoke-windows.ps1 -Dir build/modbus-poll-windows/${{ matrix.arch }} -Arch ${{ matrix.arch }} -LicenseServer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: modbus-poll-windows-${{ matrix.arch }}-smoke-${{ github.run_number }}
          path: build/modbus-poll-windows/${{ matrix.arch }}/smoke/
          if-no-files-found: ignore
          retention-days: 14
