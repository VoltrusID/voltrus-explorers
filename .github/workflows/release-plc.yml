# Voltrus PLC desktop IDE: notarized universal macOS DMG, Windows x64 zip (portable exe) and Linux .deb, built from
# the version in apps/voltrus-plc/src-tauri/tauri.conf.json. The files are uploaded as workflow artifacts; publish them
# to dl-voltrus-plc.voltrus.id with scripts/publish-plc.sh <version> --run <run id> (your own Cloudflare login).
name: Release Voltrus PLC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-voltrus-plc
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Rust targets and wasm-pack
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos-voltrus-plc-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-voltrus-plc-
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Compiler, runtime and language server (wasm)
        working-directory: apps/voltrus-plc
        run: bun run build:wasm
      - name: Signing identity and App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: scripts/ci-keychain.sh setup DEVELOPER_ID
      - name: Developer ID build (notarized)
        run: scripts/build-macos.sh voltrus-plc dmg --notarize
      - name: Checksums
        run: find build/voltrus-plc -name '*.dmg' | xargs shasum -a 256 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-plc-macos
          path: build/voltrus-plc/dmg/*.dmg
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: scripts/ci-keychain.sh cleanup

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Rust target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Compiler, runtime and language server (wasm)
        working-directory: apps/voltrus-plc
        run: bun run build:wasm
      - name: Build
        working-directory: apps/voltrus-plc
        run: bun run tauri build --no-bundle --ci
      - name: Portable zip
        shell: pwsh
        run: |
          $version = (Get-Content apps/voltrus-plc/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force build/voltrus-plc/windows | Out-Null
          Compress-Archive -Path target/release/voltrus_plc.exe -DestinationPath "build/voltrus-plc/windows/Voltrus_PLC_${version}_x64.zip"
          Get-FileHash build/voltrus-plc/windows/*.zip | Format-List
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-plc-windows
          path: build/voltrus-plc/windows/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust target and wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Compiler, runtime and language server (wasm)
        working-directory: apps/voltrus-plc
        run: bun run build:wasm
      - name: Build .deb
        working-directory: apps/voltrus-plc
        run: bun run tauri build --bundles deb --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voltrus-plc-linux
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
