[package]
name = "serial_monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# App Store build: Pro sold as an in-app purchase (see crates/mt-store).
store = ["mt-store/store"]
# Direct-download build (console + landing page): Pro is sold by licence key. Exclusive with `store`.
license = ["mt-store/license"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mt-serial = { path = "../../../crates/mt-serial" }
mt-store = { path = "../../../crates/mt-store" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tokio-serial = "5"
serialport = "4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
