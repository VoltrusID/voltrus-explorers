[package]
name = "vt-engine"
description = "Runs Voltrus Tools protocol sessions on the shared protocol crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vt-protocol = { path = "../vt-protocol" }
mt-modbus = { path = "../../../../crates/mt-modbus" }
mt-protocol = { path = "../../../../crates/mt-protocol" }
mt-bacnet = { path = "../../../../crates/mt-bacnet" }
mt-mqtt = { path = "../../../../crates/mt-mqtt" }
mt-dnp3 = { path = "../../../../crates/mt-dnp3" }
mt-enip = { path = "../../../../crates/mt-enip" }
mt-serial = { path = "../../../../crates/mt-serial" }
mt-s7 = { path = "../../../../crates/mt-s7" }
mt-ble = { path = "../../../../crates/mt-ble" }
async-channel.workspace = true
# rumqttc's MQTT codec frames the simulator's broker; prost encodes its
# Sparkplug B payloads. Same versions as mt-mqtt uses.
bytes = "1"
prost = "0.14"
rumqttc = "0.24"
# Serial monitors parse lines with a user's pattern.
regex = "1"
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
mt-nats = { path = "../../../../crates/mt-nats" }
# The client mt-nats wraps (same version): raw subscriptions, request
# headers and connection state for the NATS session.
async-nats = "0.50"
futures-util = "0.3"
tracing.workspace = true

[lints]
workspace = true
