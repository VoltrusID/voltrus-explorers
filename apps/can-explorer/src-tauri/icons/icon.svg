<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CAN Explorer: a CAN_H / CAN_L twisted pair with three nodes and a frame waveform, in the
       MacTools line-art style (black square, one green). -->
  <rect width="1024" height="1024" fill="#000"/>
  <g fill="none" stroke="#04DD3C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- differential waveform: CAN_H up, CAN_L down on dominant bits -->
    <path d="M140 470 H250 V410 H330 V470 H390 V410 H530 V470 H600 V410 H660 V470 H884"/>
    <path d="M140 530 H250 V590 H330 V530 H390 V590 H530 V530 H600 V590 H660 V530 H884" stroke-width="14"/>
    <!-- bus line and terminations -->
    <line x1="140" y1="730" x2="884" y2="730"/>
    <rect x="104" y="700" width="36" height="60" rx="8"/>
    <rect x="884" y="700" width="36" height="60" rx="8"/>
    <!-- nodes -->
    <line x1="290" y1="730" x2="290" y2="800"/>
    <rect x="230" y="800" width="120" height="90" rx="18"/>
    <line x1="512" y1="730" x2="512" y2="800"/>
    <rect x="452" y="800" width="120" height="90" rx="18"/>
    <line x1="734" y1="730" x2="734" y2="800"/>
    <rect x="674" y="800" width="120" height="90" rx="18"/>
  </g>
  <text x="512" y="300" font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800" font-size="200" fill="#04DD3C" text-anchor="middle">CAN</text>
</svg>
