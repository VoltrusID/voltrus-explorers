[package]
name = "ethercat_explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ethercat_explorer_lib"

[features]
# Direct-download build (console + landing page): Pro is sold by licence key. There is no App Store build: the App
# Sandbox does not allow raw Ethernet (BPF), which EtherCAT needs.
license = ["mt-store/license"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mt-ethercat = { path = "../../../crates/mt-ethercat" }
mt-store = { path = "../../../crates/mt-store" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
