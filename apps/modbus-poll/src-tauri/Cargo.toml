[package]
name = "modbus_poll"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "modbus_poll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mt-modbus = { path = "../../../crates/mt-modbus", default-features = false }
mt-protocol = { path = "../../../crates/mt-protocol" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
mt-modbus = { path = "../../../crates/mt-modbus", features = ["serial"] }
serialport = "4"
tokio-serial = "5"
tokio-modbus = { version = "0.16", default-features = false, features = ["rtu"] }
libc = "0.2"
