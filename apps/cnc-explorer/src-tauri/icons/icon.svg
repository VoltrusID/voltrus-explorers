<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CNC Explorer: spindle head, collet and end mill cutting a pocket in a
       workpiece, in the MacTools line-art style (black square, one green). -->
  <rect width="1024" height="1024" fill="#000"/>
  <g fill="none" stroke="#04DD3C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- spindle head with vents -->
    <rect x="292" y="104" width="440" height="220" rx="28"/>
    <line x1="342" y1="160" x2="342" y2="268"/>
    <line x1="388" y1="160" x2="388" y2="268"/>
    <!-- collet nose -->
    <path d="M412 324 L452 412 L572 412 L612 324"/>
    <!-- shank and fluted end mill, down in the pocket -->
    <line x1="490" y1="412" x2="490" y2="470"/>
    <line x1="534" y1="412" x2="534" y2="470"/>
    <rect x="476" y="470" width="72" height="250" rx="10"/>
    <path d="M476 514 L548 556 M476 574 L548 616 M476 634 L548 676"/>
    <!-- workpiece with the pocket -->
    <path d="M128 660 L428 660 L428 744 L596 744 L596 660 L896 660 L896 900 L128 900 Z"/>
    <!-- toolpath ahead of the cutter -->
    <path d="M652 702 L712 702 M762 702 L822 702"/>
  </g>
  <text x="560" y="250" font-family="Plus Jakarta Sans, DejaVu Sans, sans-serif" font-weight="800" font-size="120" fill="#04DD3C" text-anchor="middle">CNC</text>
</svg>
