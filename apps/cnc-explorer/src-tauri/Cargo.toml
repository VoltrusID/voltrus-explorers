[package]
name = "cnc_explorer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cnc_explorer_lib"

[features]
# App Store build: Pro sold as an in-app purchase (see crates/mt-store).
store = ["mt-store/store"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mt-mtconnect = { path = "../../../crates/mt-mtconnect" }
mt-focas = { path = "../../../crates/mt-focas" }
mt-store = { path = "../../../crates/mt-store" }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
