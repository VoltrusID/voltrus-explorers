    - region "Built for engineers who carry MacBooks into the field." [ref=e222]:
      - generic [ref=e223]:
        - paragraph [ref=e224]: 05 — Use Cases
        - heading "Built for engineers who carry MacBooks into the field." [level=2] [ref=e225]
        - paragraph [ref=e226]: PLC programming on Mac isn't a niche anymore. Engineering students, field commissioners, machine builders, and IoT developers are all choosing macOS — and they all need PLC tools.
        - generic [ref=e227]:
          - generic [ref=e228]:
            - generic [ref=e229]: EDU
            - heading "PLC Training & Education" [level=3] [ref=e230]
            - paragraph [ref=e231]: Learn IEC 61131-3 Structured Text without buying a $2,000 PLC trainer or installing a 20GB IDE in a VM. Write code, run it on the softPLC, see the results — all on a MacBook Air.
          - generic [ref=e232]:
            - generic [ref=e233]: FLD
            - heading "Field Commissioning" [level=3] [ref=e234]
            - paragraph [ref=e235]: You're on-site with a MacBook. The PLC is running but a register looks wrong. Write a quick ST program, map it to the device's Modbus registers, and verify the behavior — natively, no VM.
          - generic [ref=e236]:
            - generic [ref=e237]: OEM
            - heading "Machine Builder R&D" [level=3] [ref=e238]
            - paragraph [ref=e239]: Prototype control logic on your Mac before committing to hardware. Iterate on your ST code, test against simulated Modbus devices, and only deploy to production PLC when the logic is solid.
          - generic [ref=e240]:
            - generic [ref=e241]: IOT
            - heading "IoT Edge Control" [level=3] [ref=e242]
            - paragraph [ref=e243]: Develop ST programs that run on the softPLC talking to Modbus sensors. Deploy to Linux edge devices when v1.0 ships. Write once, run on Mac during dev, Linux in production.
          - generic [ref=e244]:
            - generic [ref=e245]: LAB
            - heading "Lab & Bench Testing" [level=3] [ref=e246]
            - paragraph [ref=e247]: Test PLC logic without a PLC. Map your ST variables to a Modbus simulator, run scenarios, verify behavior. No hardware on the bench — just your Mac and the app.
          - generic [ref=e248]:
            - generic [ref=e249]: DEV
            - heading "Embedded ST Development" [level=3] [ref=e250]
            - paragraph [ref=e251]: If you're building a device that runs IEC 61131-3, use Voltrus PLC as your dev environment. The compiler and VM are Rust crates — integrate them into your own toolchain.
