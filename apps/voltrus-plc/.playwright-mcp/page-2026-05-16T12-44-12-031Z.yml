    - region "You're running CODESYS in a Windows VM on a $3,000 MacBook." [ref=e49]:
      - generic [ref=e50]:
        - paragraph [ref=e51]: 01 — The Problem
        - heading "You're running CODESYS in a Windows VM on a $3,000 MacBook." [level=2] [ref=e52]
        - paragraph [ref=e53]: Industrial automation engineers are increasingly carrying MacBooks into the field. But every PLC IDE — CODESYS, TIA Portal, TwinCAT, Studio 5000 — is Windows-only. You're paying for Parallels, fighting USB passthrough, and watching a 20GB IDE crawl on hardware that should scream.
        - generic [ref=e54]:
          - generic [ref=e55]:
            - generic [ref=e56]: "01"
            - heading "The Windows VM Tax" [level=3] [ref=e57]
            - paragraph [ref=e58]: Parallels Desktop ($100/yr) + Windows license ($139) + CODESYS runtime licenses. You're paying hundreds before you write a single line of ST. On Apple Silicon, USB passthrough for RS485 adapters breaks unpredictably.
          - generic [ref=e59]:
            - generic [ref=e60]: "02"
            - heading "20GB of Bloat" [level=3] [ref=e61]
            - paragraph [ref=e62]: TIA Portal requires 16-20GB just to install. Engineers on Siemens' own forum report 5-10 minute project open times on i7/32GB machines. CODESYS freezes for 15-20 minutes on incremental downloads with large symbol configs.
          - generic [ref=e63]:
            - generic [ref=e64]: "03"
            - heading "Multi-Monitor Hell" [level=3] [ref=e65]
            - paragraph [ref=e66]: CODESYS windows appear completely off-screen on multi-monitor Mac setups — unrecoverable without changing display settings. TIA Portal's custom GUI toolkit overdraws onto adjacent monitors. These are bugs engineers have reported for years.
          - generic [ref=e67]:
            - generic [ref=e68]: "04"
            - heading "Total Vendor Lock-In" [level=3] [ref=e69]
            - paragraph [ref=e70]: TIA Portal only programs Siemens PLCs. Studio 5000 only programs Allen-Bradley. CODESYS is more open but ties you to Windows. No PLC IDE lets you write vendor-neutral IEC 61131-3 code on the hardware you already own.
    - region "A PLC IDE that feels like modern developer tooling." [ref=e71]:
      - generic [ref=e72]:
        - paragraph [ref=e73]: 02 — Features
        - heading "A PLC IDE that feels like modern developer tooling." [level=2] [ref=e74]
        - paragraph [ref=e75]: CodeMirror 6 editor with syntax highlighting. Bytecode compiler. SoftPLC runtime with cyclic scan. Real Modbus I/O. All in ~30MB.
        - generic [ref=e76]:
          - generic [ref=e77]:
            - generic [ref=e78]: "01"
            - heading "Structured Text Editor" [level=3] [ref=e79]
            - paragraph [ref=e80]: CodeMirror 6 with IEC 61131-3 ST syntax highlighting, bracket matching, code folding, and autocomplete for keywords, types, and standard functions. Feel like you're in VS Code, not a 1990s ladder editor.
          - generic [ref=e81]:
            - generic [ref=e82]: "02"
            - heading "Built-in SoftPLC Runtime" [level=3] [ref=e83]
            - paragraph [ref=e84]: Custom bytecode VM with cyclic scan engine. Compile ST → bytecode → run locally. Adjustable scan cycle from 1ms to 1s. Run, Stop, and Step controls. Watch your program execute in real-time — no hardware required.
          - generic [ref=e85]:
            - generic [ref=e86]: "03"
            - heading "Modbus TCP + RTU I/O" [level=3] [ref=e87]
            - paragraph [ref=e88]: Real I/O drivers wrapping mt-modbus. Direct address support (%IX0.0, %QW100, %MW200). Map variables to Modbus registers through the I/O mapping panel. Read/write real devices from your ST program.
          - generic [ref=e89]:
            - generic [ref=e90]: "04"
            - heading "Live Watch Table" [level=3] [ref=e91]
            - paragraph [ref=e92]: Monitor variable values in real-time while the runtime is running. Add variables to watch, see values update every scan cycle. No more printf debugging — see exactly what your PLC program is doing at every step.
          - generic [ref=e93]:
            - generic [ref=e94]: "05"
            - heading "Timer & Counter Blocks" [level=3] [ref=e95]
            - paragraph [ref=e96]: "Real implementations of IEC 61131-3 standard function blocks: TON, TOF, TP (timers), CTU, CTD, CTUD (counters), R_TRIG, F_TRIG (edge detection). Not stubs — properly implemented with correct timing behavior."
          - generic [ref=e97]:
            - generic [ref=e98]: "06"
            - heading "Diagnostics Panel" [level=3] [ref=e99]
            - paragraph [ref=e100]: Compile errors and warnings with source locations. Inline error squiggles in the editor (coming v0.2). See exactly what failed and where — not a cryptic "Compilation failed" dialog.
          - generic [ref=e101]:
            - generic [ref=e102]: "07"
            - heading "Dark & Light Themes" [level=3] [ref=e103]
            - paragraph [ref=e104]: Full dark mode and light mode that actually works end-to-end. Modern syntax highlighting in both. Your eyes at 2am on a commissioning call will thank you.
          - generic [ref=e105]:
            - generic [ref=e106]: "08"
            - heading "AI-Assisted Programming" [level=3] [ref=e107]
            - paragraph [ref=e108]: Coming v0.3 — describe logic in natural language, get ST code. Click a diagnostic, get a suggested fix. AI knows your variables, POU structure, and I/O mapping. The first PLC IDE with integrated AI — before Beckhoff ships theirs to Mac.
          - generic [ref=e109]:
            - generic [ref=e110]: "09"
            - heading "Multi-File Projects" [level=3] [ref=e111]
            - paragraph [ref=e112]: Project tree sidebar with folder-based .st files. Multi-file tabs with save/load to disk. Go-to-definition for variables and function blocks. Structured like a real software project — because PLC code is software.
