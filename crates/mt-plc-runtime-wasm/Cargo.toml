[package]
name = "mt-plc-runtime-wasm"
version.workspace = true
edition.workspace = true
description = "WASM build of the Voltrus PLC runtime for the cloud IDE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mt-plc-runtime = { path = "../mt-plc-runtime", default-features = false }
mt-plc-types = { path = "../mt-plc-types" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[dev-dependencies]
mt-stc = { path = "../mt-stc" }
