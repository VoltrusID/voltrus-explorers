[package]
name = "focas-proto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "FANUC FOCAS/Ethernet wire-protocol client and CNC simulator in pure Rust (independent, not affiliated with FANUC)"

[dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
# `rt-multi-thread` + `signal` for the `focas_sim` example and the loopback tests.
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros", "time"] }
