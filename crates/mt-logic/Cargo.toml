[package]
name = "mt-logic"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["usb", "download"]
# The real USB backend of the FX2 driver (nusb). Without it only the simulated device is available.
usb = ["dep:nusb"]
# Fetching the fx2lafw firmware from sigrok.org on the user's request.
download = ["dep:reqwest", "dep:tar"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
nusb = { version = "0.2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tar = { version = "0.4", optional = true }
