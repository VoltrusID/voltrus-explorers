[package]
name = "mt-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# App Store builds: Pro is sold through StoreKit. Without it (source / GitHub builds) everything is unlocked.
store = ["dep:tauri-plugin-iap"]
# Direct-sale builds (Windows): Pro unlocks with a licence key bought from Voltrus, activated online once (see `key`).
keys = ["dep:reqwest", "dep:sha2"]
# Direct-download builds (macOS DMG from the console) that sell Pro by licence key (Polar, bought in the Voltrus
# console); the key lives in the Keychain (see `license`). Exclusive with `store` and `keys`.
license = ["dep:reqwest", "dep:tokio", "dep:uuid", "dep:security-framework"]

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-iap = { version = "0.9.1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", optional = true }

[dev-dependencies]
tokio = { workspace = true }
