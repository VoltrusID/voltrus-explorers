[workspace]
resolver = "2"
members = [
    "crates/mt-protocol",
    "crates/mt-modbus",
    "crates/mt-bacnet",
    "crates/mt-dnp3",
    "crates/mt-enip",
    "crates/mt-store",
    "apps/modbus-poll/src-tauri",
    "apps/bacnet-explorer/src-tauri",
    "apps/dnp3-explorer/src-tauri",
    "apps/enip-explorer/src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/VoltrusID/voltrus-explorers"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
