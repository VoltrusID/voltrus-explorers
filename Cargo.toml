[workspace]
resolver = "2"
members = [
    "crates/mt-protocol",
    "crates/mt-modbus",
    "crates/mt-bacnet",
    "crates/mt-dnp3",
    "crates/mt-ble",
    "crates/mt-enip",
    "crates/mt-nats",
    "crates/mt-store",
    "crates/mt-s7",
    "crates/mt-serial",
    "crates/mt-mqtt",
    "crates/mt-opcua",
    "crates/mt-connect",
    "crates/mt-mtconnect",
    "crates/focas-proto",
    "crates/mt-secsgem",
    "apps/modbus-poll/src-tauri",
    "apps/bacnet-explorer/src-tauri",
    "apps/ble-inspector/src-tauri",
    "apps/nats-explorer/src-tauri",
    "apps/dnp3-explorer/src-tauri",
    "apps/cnc-explorer/src-tauri",
    "apps/secsgem-explorer/src-tauri",
    "apps/s7-explorer/src-tauri",
    "apps/enip-explorer/src-tauri",
    "apps/serial-monitor/src-tauri",
    "apps/mqtt-explorer/src-tauri",
    "apps/opcua-explorer/src-tauri",
]
# Patched third-party crates, used through [patch.crates-io] below (not workspace members).
exclude = ["vendor"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/VoltrusID/voltrus-explorers"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# rumqttd 0.20.0 and rumqttc 0.25.1 (Apache-2.0, bytebeamio/rumqtt), vendored with their TLS dependencies moved to
# tokio-rustls 0.26 / rustls 0.23 and rustls-webpki 0.103: upstream's latest releases still pull rustls 0.22 and
# webpki 0.102, which have open advisories (fixed in rustls 0.23.46, webpki 0.103.12). Nothing else is changed;
# see vendor/README.md. Drop the patch once upstream releases versions on these lines.
[patch.crates-io]
rumqttd = { path = "vendor/rumqttd" }
rumqttc = { path = "vendor/rumqttc" }
